apiVersion: v1
kind: Service
metadata:
  name: c2-api
  namespace: demo
spec:
  selector: { app: c2, tier: web }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c2-api
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: c2, tier: backend }
  template:
    metadata:
      labels: { app: c2, tier: backend }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
