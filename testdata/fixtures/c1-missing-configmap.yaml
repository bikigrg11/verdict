apiVersion: apps/v1
kind: Deployment
metadata:
  name: c1-missing-configmap
  namespace: demo
spec:
  replicas: 3
  selector:
    matchLabels: { app: c1 }
  template:
    metadata:
      labels: { app: c1 }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          envFrom:
            - configMapRef:
                name: does-not-exist
