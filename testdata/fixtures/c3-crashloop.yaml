apiVersion: apps/v1
kind: Deployment
metadata:
  name: c3-crashloop
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: c3 }
  template:
    metadata:
      labels: { app: c3 }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'ERROR: cannot bind port 8080' >&2; exit 2"]
